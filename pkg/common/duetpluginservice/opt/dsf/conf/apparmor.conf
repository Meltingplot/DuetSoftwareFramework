#include <tunables/global>

# DuetPluginService starts the plugin in this profile by its name (aa-exec -p dsf.<id>), which confines everything the plugin runs,
# also bash and the Python interpreter of its venv, which are not below the plugin directory. The profile does not attach by path
profile dsf.{pluginId} {
  #include <abstractions/base>
  #include <abstractions/bash>
  #include <abstractions/python>
  #include <abstractions/user-tmp>
{includes}

  /dev/tty rw,
  /etc/ssl/** r,
  /usr/bin/python{2.[4-7],3,3.[0-9],3.1[0-9]} rix,
  /usr/local/lib{,32,64}/python{2.[4-7],3,3.[0-9]}/{site,dist}-packages/** r,
  /opt/vc/lib/** rm,

  capability dac_override,
  capability dac_read_search,
  capability sys_nice,

  # Only allow signalling self and same-profile peers (direct children that inherited this profile) - prevents a
  # plugin from SIGKILLing DCS, DPS, or other plugins
  signal (send) peer=@{profile_name},

  /opt/dsf/bin/* rm,
  owner {pluginDirectory}/ r,
  owner {pluginDirectory}/** rwmlk,
  owner /proc/@{pid}/** rw,
  /sys/** r,
  # The socket of DuetControlServer is the only file in /run/dsf that every plugin needs. Unix sockets with a path are mediated by file
  # rules (apparmor.d(5), "Unix socket rules"), and w lets the plugin unlink the socket too. The sockets of HTTP endpoints are added with
  # RegisterHttpEndpoints
  /{,var/}run/dsf/dcs.sock rw,

{rules}
}
